[project]
name = "burn-rate"
version = "0.1.0"
description = "SLOs, burn-rate alerts, and an error-budget deploy gate on Kubernetes"
requires-python = ">=3.12"
license = "Apache-2.0"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.coverage.run]
source = ["app", "gate"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
