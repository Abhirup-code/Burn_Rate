apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: checkout
resources:
  - namespace.yaml
  - app.yaml
  - loadgen.yaml
  - slo-rules.yaml # generated from slos/checkout.yaml
configMapGenerator:
  - name: loadgen-script
    files:
      - loadgen/checkout.js
  # Grafana's sidecar loads any ConfigMap labeled grafana_dashboard=1, from any namespace.
  - name: checkout-slo-dashboard
    files:
      - dashboards/checkout-slo.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
