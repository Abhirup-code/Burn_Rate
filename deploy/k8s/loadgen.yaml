# Runs the k6 script nonstop inside the cluster: 10 checkout requests per second.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  labels:
    app: loadgen
spec:
  replicas: 1
  # k6 has no health endpoint, so make the rollout wait 15 s: a crash at startup now fails up.sh
  # right away instead of surfacing later as missing traffic.
  minReadySeconds: 15
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 12345
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k6
          image: grafana/k6:2.3.0
          # k6 2.x replaced --no-summary with --summary-mode=disabled.
          args: ["run", "--quiet", "--summary-mode=disabled", "/scripts/checkout.js"]
          env:
            - name: BASE_URL
              value: http://checkout.checkout.svc
            - name: RATE
              value: "10"
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: script
          configMap:
            name: loadgen-script
        - name: tmp
          emptyDir: {}
