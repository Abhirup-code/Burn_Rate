name: Kubernetes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifests and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kubeconform
        run: |
          curl -fsSLo kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tgz" | sha256sum --check
          tar xzf kubeconform.tgz kubeconform
      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize deploy/k8s > rendered.yaml
          ./kubeconform -strict -summary -kubernetes-version 1.34.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

  e2e:
    name: Run the lab on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          install_only: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Build everything with the same script you run locally
        run: scripts/up.sh
      - name: Prometheus is scraping checkout traffic
        run: scripts/check.sh
      - name: The chaos switch shows up in the metrics
        run: |
          scripts/chaos.sh 1 0
          scripts/check-errors.sh
          scripts/chaos.sh 0 0
      - name: Show what went wrong
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n checkout describe pods
          kubectl -n checkout logs deploy/checkout --tail 50 || true
          kubectl -n checkout logs deploy/loadgen --tail 50 || true
